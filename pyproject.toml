[project]
name = "freezing"
version = "0"
description = "Freezing Saddles monorepo: shared model, web, sync and nq"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
# Freezebot is an sbt build, not a Python package.
exclude = ["apps/freezebot"]

[dependency-groups]
dev = [
    "autoflake==2.4.0",
    "bandit==1.9.4",
    "black==26.5.1",
    "djlint==1.46.1",
    "fawltydeps==0.20.0",
    "flake8==7.3.0",
    "flake8-bugbear==26.9.9",
    "flake8-builtins==3.1.0",
    "flake8-comprehensions==3.17.0",
    "flake8-docstrings==1.7.0",
    "flake8-eradicate==1.5.0",
    "flake8-print==5.0.0",
    "flake8-pyproject==1.2.4",
    "flake8-quotes==3.4.0",
    "flake8-raise==0.0.5",
    "flake8-return==1.2.0",
    "flake8-simplify==0.30.0",
    "isort==9.0.1",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pymarkdownlnt==0.9.40",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
]

[tool.black]
# Format for the Python that runs it (.python-version). Left unset, black infers
# every version from requires-python up to the newest it knows and its safety
# check cannot parse that on 3.10.
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
# The packages; `mypy` with no arguments checks these, as CI does.
files = [
    "packages/model/freezing",
    "packages/common/freezing",
    "apps/web/freezing",
    "apps/sync/freezing",
    "apps/nq/freezing",
]
# The ORM is declarative_base() with Column attributes, which mypy reads only
# with SQLAlchemy's plugin (deprecated in 2.0 in favour of Mapped[] annotations,
# still shipped).
plugins = ["sqlalchemy.ext.mypy.plugin"]
# Libraries without type information are Any rather than errors.
ignore_missing_imports = true

[tool.isort]
profile = "black"
known_first_party = ["freezing"]

[tool.flake8]
max-line-length = 88
max-complexity = 39
inline-quotes = "double"
exclude = [".venv", ".git", "__pycache__", "build", "dist", "node_modules", "target"]
ignore = [
    # black's formatting: slices, line length, line breaks before operators.
    "E203",
    "E501",
    "W503",
    # Missing docstrings (D100-D107): documenting what exists is required to be
    # right (D2xx, D4xx), documenting everything is not.
    "D1",
    # Class attributes named like builtins: the ORM's `id` and `type` columns.
    "A003",
]
per-file-ignores = [
    # Alembic's own layout puts the revision identifiers before the imports,
    # and a migration reports with print.
    "packages/model/freezing/model/migrations/versions/*.py:E402,T201",
    "packages/model/freezing/model/migrations/env.py:T201",
    # Command-line scripts print.
    "packages/model/bin/*.py:T201",
]

[tool.pymarkdown]
plugins.md013.enabled = false
extensions.front-matter.enabled = true
