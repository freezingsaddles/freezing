[project]
name = "freezing"
version = "0"
description = "Freezing Saddles monorepo: shared model, web, sync and nq"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "autoflake==2.4.0",
    "bandit==1.9.4",
    "black==26.5.1",
    "djlint==1.36.4",
    "fawltydeps==0.20.0",
    "flake8==7.3.0",
    "flake8-bugbear==26.9.9",
    "flake8-builtins==3.1.0",
    "flake8-comprehensions==3.17.0",
    "flake8-docstrings==1.7.0",
    "flake8-eradicate==1.5.0",
    "flake8-print==5.0.0",
    "flake8-pyproject==1.2.4",
    "flake8-quotes==3.4.0",
    "flake8-raise==0.0.5",
    "flake8-return==1.2.0",
    "flake8-simplify==0.30.0",
    "flake8-sorted-keys==0.2.0",
    "flake8-todo==0.7",
    "isort==9.0.1",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pymarkdownlnt==0.9.37",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
]

[tool.isort]
profile = "black"
known_first_party = ["freezing"]

[tool.flake8]
# Thanks https://www.reddit.com/r/learnpython/comments/rr6y69/comment/hqeqt68/?utm_source=share&utm_medium=web2x&context=3
ignore = [
    "E203",
    "E501",
    "W503",
]
max-line-length = 88
max-complexity = 39
extend-ignore = "E203"
inline-quotes = "double"
exclude = [".venv", ".git", "__pycache__", "build", "dist"]

[tool.pymarkdown]
plugins.md013.enabled = false
extensions.front-matter.enabled = true
