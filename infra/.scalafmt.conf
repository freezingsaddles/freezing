version = 3.11.5
runner.dialect = scala3
maxColumn = 100
align.preset = most
assumeStandardLibraryStripMargin = true
importSelectors = "noBinPack"
rewrite.rules = [Imports]
rewrite.imports.sort = scalastyle
rewrite.imports.groups = [["org\\.freezingsaddles\\..*"]]

rewrite.trailingCommas.style = multiple
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.optionalBraces {
  enabled = true
  preferInsert = false
  # The span is visible-token characters, not lines, so a modest cap leaves
  # every substantial lambda argument braced; this one nothing real reaches.
  # Not parensToo, which converts every one-line single-argument call.
  fewerBraces { minSpan = 3, maxSpan = 50000 }
}
rewrite.scala3.endMarker {
  preferInsert = true
  insert { minBreaks = 10, minBlankGaps = 2 }
}

# .sbt files default to scalafmt's `sbt` dialect, which rejects Scala 3
# significant-indentation; force scala3 so the build definitions parse.
fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = scala3
  }
}
