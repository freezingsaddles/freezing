[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "freezing-nq"
version = "0.4.3"
description = "Freezing Saddles activity receive and enqueue worker"
readme = "README.md"
authors = [
    {name = "Hans Lellelid", email = "hans@xmpl.org"},
    {name = "Richard Bullington-McGuire", email = "richard.bullington.mcguire@gmail.com"},
]
maintainers = [
    {name = "Richard Bullington-McGuire", email="richard.bullington.mcguire@gmail.com"},
]
license = {text = "Apache License (2.0)"}
requires-python = ">=3.14"
dependencies = [
    "arrow>=1.4.0,<2",
    "envparse>=0.2.0,<1",
    "falcon>=4.3.1,<5",
    "freezing-model",
    "greenstalk>=2.1.1,<3",
    "gunicorn>=26.2.0,<27",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Games",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
]

[tool.fawltydeps]
# Dev tools and flake8 plugins are run, never imported; gunicorn is the
# container entrypoint; freezing-model is a namespace package fawltydeps
# cannot map to its imports.
# pytest comes from the workspace dev group
ignore_undeclared = ["pytest"]
ignore_unused = [
    "bandit",
    "black",
    "fawltydeps",
    "flake8",
    "flake8-bugbear",
    "flake8-builtins",
    "flake8-comprehensions",
    "flake8-docstrings",
    "flake8-eradicate",
    "flake8-print",
    "flake8-pyproject",
    "flake8-raise",
    "flake8-simplify",
    "freezing-model",
    "gunicorn",
    "isort",
    "mypy",
    "pytest-mock",
]

[tool.uv.sources]
freezing-model = { workspace = true }
