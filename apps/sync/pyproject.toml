[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "freezing-sync"
version = "1.6.0"
description = "Freezing Saddles activity and metadata sync."
authors = [
    {name = "Hans Lellelid", email = "hans@xmpl.org"},
    {name = "Merlin Hughes"},
    {name = "Richard Bullington-McGuire", email = "richard.bullington.mcguire@gmail.com"},
]
maintainers = [
    {name = "Richard Bullington-McGuire", email = "richard.bullington.mcguire@gmail.com"},
]
license = {text = "Apache License (2.0)"}
requires-python = ">=3.14"
dependencies = [
    "APScheduler>=3.11.3,<4",
    "GeoAlchemy2>=0.18.1,<1",
    "PyMySQL>=1.1.2,<2",
    "SQLAlchemy>=2.0.52,<3",
    "colorlog>=6.12.0,<7",
    "datadog>=0.53.0,<1",
    "envparse>=0.2.0,<1",
    "freezing-common",
    "freezing-model",
    "greenstalk>=2.1.1,<3",
    "python-dateutil>=2.9.0,<3",
    "requests>=2.33.1,<3",
    "stravalib>=2.4,<3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games",
]

[project.entry-points.console_scripts]
freezing-sync = "freezing.sync.run:main"
freezing-deauthorize = "freezing.sync.cli.deauthorize:main"
freezing-deauthorize-history = "freezing.sync.cli.deauthorize_history:main"
freezing-sync-activities = "freezing.sync.cli.sync_activities:main"
freezing-sync-athletes = "freezing.sync.cli.sync_athletes:main"
freezing-sync-detail = "freezing.sync.cli.sync_details:main"
freezing-sync-photos = "freezing.sync.cli.sync_photos:main"
freezing-sync-streams = "freezing.sync.cli.sync_streams:main"
freezing-sync-weather = "freezing.sync.cli.sync_weather:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["freezing*"]
namespaces = true

[tool.fawltydeps]
# PyMySQL is loaded by SQLAlchemy from the database URL; freezing-model is a
# namespace package fawltydeps cannot map to its imports.
ignore_unused = ["PyMySQL", "freezing-common", "freezing-model"]
# pytest comes from the workspace dev group
ignore_undeclared = ["pytest"]

[tool.pytest.ini_options]
pythonpath = "."
addopts = [
    "--import-mode=importlib",
]
markers = [
    "live: marks tests that make real network calls to Strava API (deselect with '-m \"not live\"')",
]

[tool.uv.sources]
freezing-common = { workspace = true }
freezing-model = { workspace = true }
