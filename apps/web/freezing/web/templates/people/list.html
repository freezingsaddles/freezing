{% extends "base.html" %}
{% block content %}
    <h1>All Participants</h1>
    <table class="table table-condensed">
        <tr>
            <th>Rider</th>
            <th>Team</th>
            <th class="number">Rides</th>
            <th class="number">Miles</th>
        </tr>
        {% for u in users %}
            <tr class="{{ u._mapping['id'] | myself }}">
                <td>
                    <a href="/people/{{ u._mapping['id'] }}"
                       class="hover-underline">{{ u._mapping['display_name'] }}</a>
                </td>
                <td>
                    <a href="/teams/{{ u._mapping['team_id'] }}"
                       class="hover-underline">{{ u._mapping['team_name'] }}</a>
                </td>
                <td class="number">{{ u._mapping['rides']|groupnum }}</td>
                <td class="number">{{ u._mapping['miles']|round|int|groupnum }}</td>
            </tr>
        {% endfor %}
    </table>
{% endblock %}
