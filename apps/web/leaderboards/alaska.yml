---
title: The Hains Point Alaska Salmon Award
description: |
  A subprize of the <a href="/pointless/segment/37893544">Hains Point Salmon Award</a>,
  for 1 lb of Kirkland Alaska Smoked Sockeye Salmon. The winner shall be the cyclist who,
  in a single ride, completes the most
  <a href="https://www.strava.com/segments/37893544" target="_blank" rel="noreferrer">Hains Point Gate to Gate (Reverse)</a>
  segments and rides the length of Alaska Avenue, measured by completing either the
  <a href="https://www.strava.com/segments/23962584" target="_blank" rel="noreferrer">Alaska to Georgia</a>
  segment (northbound) or the
  <a href="https://www.strava.com/segments/40631604" target="_blank" rel="noreferrer">Olive Alaska</a>
  segment (southbound).
discord: 1575131434627367033
sponsors: [29577875]
fields:
  - name: athlete_id
    visible: false
  - name: athlete_name
    label: Rider
    type: athlete
  - name: salmon_laps
    label: Salmon Laps
    rank_by: true
    type: number
  - name: ride_ids
    visible: false
query: |
  with alaska_rides as (
    select
      distinct E.ride_id
    from ride_efforts E
      where E.segment_id = 40631604 or E.segment_id = 23962584
  ), salmon_rides as (
    select
      E.ride_id,
      count(*) as salmon_laps
    from ride_efforts E
    where E.segment_id = 37893544
    group by E.ride_id
  ) select
    A.id as athlete_id,
    A.display_name as athlete_name,
    max(SR.salmon_laps) as salmon_laps,
    group_concat(hex(R.id)) as ride_ids
  from
    athletes A join
    rides R on R.athlete_id = A.id join
    alaska_rides AR on AR.ride_id = R.id join
    salmon_rides SR on SR.ride_id = R.id
  group by  
    A.id, A.display_name
  order by
    salmon_laps desc, athlete_name asc
