---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/apps/web"
      - "/apps/sync"
      - "/apps/nq"
      - "/docker/beanstalkd"
    schedule:
      interval: "weekly"
    ignore:
      # The Python version is pinned for the whole workspace in .python-version;
      # bump it there deliberately, not per Dockerfile.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
