---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/apps/web"
      - "/apps/sync"
      - "/apps/nq"
      - "/docker/beanstalkd"
    schedule:
      interval: "weekly"
