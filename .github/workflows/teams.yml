---
name: Teams

on:
  push:
    branches:
      - 'main'
    paths:
      - 'teams/**'
      - '.github/workflows/teams.yml'
  pull_request:
    paths:
      - 'teams/**'
      - '.github/workflows/teams.yml'

permissions:
  contents: read

jobs:
  build:
    name: teams
    permissions:
      checks: write        # for test results
      pull-requests: write # for test results
      contents: write      # for sbt-dependency-submission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
      - name: Run tests
        working-directory: teams
        run: sbt --server --batch test
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: always()
        with:
          files: |
            teams/target/out/**/test-reports/*.xml
      - name: Upload dependency graph
        uses: scalacenter/sbt-dependency-submission@7b2f7e1418cb4a77fee99f9eb07c3f7577b9a867 # v3
        with:
          working-directory: teams
