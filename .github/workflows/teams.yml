---
name: Teams

on:
  push:
    branches:
      - 'main'
    paths:
      - 'teams/**'
      - '.github/workflows/teams.yml'
  pull_request:
    paths:
      - 'teams/**'
      - '.github/workflows/teams.yml'

permissions:
  contents: read

jobs:
  build:
    name: teams
    permissions:
      checks: write        # for test results
      pull-requests: write # for test results
      contents: write      # for sbt-dependency-submission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13
      - name: Run tests
        working-directory: teams
        run: sbt --server --batch testFull
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always()
        with:
          files: |
            teams/target/out/**/test-reports/*.xml
      - name: Upload dependency graph
        uses: scalacenter/sbt-dependency-submission@7b2f7e1418cb4a77fee99f9eb07c3f7577b9a867 # v3
        with:
          working-directory: teams
