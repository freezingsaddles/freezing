---
name: Infra

on:
  push:
    branches:
      - 'main'
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  build:
    name: infra
    permissions:
      contents: write      # for sbt-dependency-submission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - name: "Lambda: format check, tests, jar"
        working-directory: infra
        run: sbt --server --batch "scalafmtCheckAll; test; assembly"
      - name: "CDK: format check, compile"
        working-directory: infra/cdk
        run: sbt --server --batch "scalafmtCheckAll; compile"
      - name: "Lambda: upload dependency graph"
        uses: scalacenter/sbt-dependency-submission@7b2f7e1418cb4a77fee99f9eb07c3f7577b9a867 # v3
        with:
          working-directory: infra
      - name: "CDK: upload dependency graph"
        uses: scalacenter/sbt-dependency-submission@7b2f7e1418cb4a77fee99f9eb07c3f7577b9a867 # v3
        with:
          working-directory: infra/cdk
      - name: "CDK: synth"
        # Placeholder context: proves the stack renders, not that the account is configured.
        working-directory: infra/cdk
        run: |
          npm ci
          npx cdk synth --quiet \
            -c hostedZoneId=Z0000000000000000000 \
            -c zoneName=freezingsaddles.org \
            -c dbHost=db.example -c dbUser=freezing
