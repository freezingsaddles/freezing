---
name: Infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  build:
    name: infra
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9
      - name: "Lambda: format check, tests, jar"
        working-directory: infra
        run: sbt --server --batch "scalafmtCheckAll; test; assembly"
      - name: "CDK: format check, compile"
        working-directory: infra/cdk
        run: sbt --server --batch "scalafmtCheckAll; compile"
      - name: "CDK: synth"
        # Placeholder context: proves the stack renders, not that the account is configured.
        working-directory: infra/cdk
        run: |
          npm ci
          npx cdk synth --quiet \
            -c hostedZoneId=Z0000000000000000000 \
            -c zoneName=freezingsaddles.org \
            -c dbHost=db.example -c dbUser=freezing
