---
name: Infra Deploy

on:
  push:
    branches:
      - 'main'
    paths:
      - 'infra/**'
      - '.github/workflows/infra-deploy.yml'

permissions:
  contents: read

# One at a time: a second push waits rather than racing CloudFormation.
concurrency: infra-deploy

jobs:
  deploy:
    name: cdk deploy
    # The role's trust policy names this repository and the main ref, so a run
    # from anywhere else could not assume it in any case; the environment adds
    # the branch restriction on the secret.
    environment: production
    permissions:
      id-token: write # mint the OIDC token traded for the AWS role
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9
      # Before the build: a credentials problem should cost seconds, not a jar.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
          role-session-name: freezing-infra-deploy # names the run in CloudTrail
          aws-region: us-east-1
      # The jar is the Lambda asset, so it has to exist before synth reads it.
      - name: Build the Lambda jar
        working-directory: infra
        run: sbt --server --batch "test; assembly"
      - name: cdk deploy
        working-directory: infra/cdk
        # Configuration is repository variables; a variable left unset passes an
        # empty value, which the stack reads as absent. --require-approval never
        # because the deploy changes IAM and nobody is here to say yes.
        run: |
          npm ci
          npx cdk deploy --require-approval never \
            -c hostedZoneId="${{ vars.INFRA_HOSTED_ZONE_ID }}" \
            -c zoneName="${{ vars.INFRA_ZONE_NAME }}" \
            -c recipient="${{ vars.INFRA_RECIPIENT }}" \
            -c dbHost="${{ vars.INFRA_DB_HOST }}" \
            -c dbPort="${{ vars.INFRA_DB_PORT }}" \
            -c dbName="${{ vars.INFRA_DB_NAME }}" \
            -c dbUser="${{ vars.INFRA_DB_USER }}" \
            -c dbPassword="${{ secrets.INFRA_DB_PASSWORD }}" \
            -c vpcId="${{ vars.INFRA_VPC_ID }}" \
            -c dbSecurityGroupId="${{ vars.INFRA_DB_SECURITY_GROUP_ID }}"
