---
name: Freezebot

on:
  push:
    branches:
      - 'main'
    paths:
      - 'apps/freezebot/**'
      - '.github/workflows/freezebot.yml'
  pull_request:
    paths:
      - 'apps/freezebot/**'
      - '.github/workflows/freezebot.yml'

permissions:
  contents: read

jobs:
  build:
    name: freezebot
    permissions:
      checks: write        # for test results
      pull-requests: write # for test results
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Format check, tests, jar
        working-directory: apps/freezebot
        run: sbt --server --batch "scalafmtCheckAll; testFull; assembly"
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always()
        with:
          files: |
            apps/freezebot/target/out/**/test-reports/*.xml
