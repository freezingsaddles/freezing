---
name: Scala Steward

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  scala-steward:
    name: Scala Steward
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # For the repos file below; the build roots come from .scala-steward.conf
      # in the checked-out repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The newest JDK any of the builds wants; the others compile on it too.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 25
      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9
      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee # v2.96.0
        with:
          # The Freezing Saddles GitHub App, installed on the org. Its ids are not
          # secrets; only its private key is.
          github-app-id: ${{ vars.SCALA_STEWARD_APP_ID }}
          github-app-installation-id: ${{ vars.SCALA_STEWARD_INSTALLATION_ID }}
          github-app-key: ${{ secrets.SCALA_STEWARD_APP_PRIVATE_KEY }}
          # Only this repository. Without a list the action stewards every
          # repository the App is installed on. Which sbt builds inside it to
          # visit is .scala-steward.conf's buildRoots.
          repos-file: .github/scala-steward-repos.md
