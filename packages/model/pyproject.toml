[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "freezing-model"
version = "0.13.0"
description = "shared database model and message definitions for Freezing Saddles"
readme = "README.md"
authors = [
    {name = "Hans Lellelid", email = "$hans@xmpl.org"},
    {name = "Merlin Hughes", email = "merlin@merlin.org"},
    {name = "Richard Bullington-McGuire", email = "richard.bullington.mcguire@gmail.com"},
    {name = "Samuel Frantz", email = "sfrantz@gwu.edu"},
]
maintainers = [
    {name = "Richard Bullington-McGuire", email="richard.bullington.mcguire@gmail.com"},
]
license = {text = "Apache License (2.0)"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Games",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Natural Language :: English",
]
dependencies = [
    "GeoAlchemy2>=0.14,<1",
    "PyMySQL>=1.0,<2",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "arrow>=1.0,<2",
    "colorlog>=6,<7",
    "envparse>=0.2",
    "marshmallow>=3.18,<5",
    "pytz>=2024",
]

[tool.fawltydeps]
# Dev tools and flake8 plugins are run, never imported
ignore_unused = [
    "black",
    "fawltydeps",
    "flake8",
    "isort",
    "flake8-bugbear",
    "flake8-builtins",
    "flake8-comprehensions",
    "flake8-docstrings",
    "flake8-eradicate",
    "flake8-print",
    "flake8-pyproject",
    "flake8-quotes",
    "flake8-raise",
    "flake8-return",
    "flake8-simplify",
    "flake8-sorted-keys",
    "flake8-todo",
]

